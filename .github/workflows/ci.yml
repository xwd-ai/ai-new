name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go 服务单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go-retrieval/go.sum
            go-business/go.sum
            go-gateway/go.sum

      - name: 检索服务
        working-directory: go-retrieval
        run: go test ./... -race

      - name: 业务服务
        working-directory: go-business
        run: go test ./... -race

      - name: 网关
        working-directory: go-gateway
        run: go test ./... -race

  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt

      - name: 运行测试
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest backend/tests -q \
            --deselect backend/tests/test_http_e2e.py::test_http_journal_recovery_after_restart_and_model_failure \
            --deselect backend/tests/test_http_e2e.py::test_http_stage_filter_pagination_and_recovery_across_restarts

  e2e-restart:
    name: 重启类端到端（观察性）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt

      - name: 重启与阶段性恢复用例
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest backend/tests/test_http_e2e.py -q \
            -k "journal_recovery_after_restart or stage_filter_pagination_and_recovery"
