services:
  mysql:
    image: mysql:8.0
    container_name: ainew-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ainew}
      MYSQL_USER: ${MYSQL_USER:-ainew}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ainew}
    ports:
      # 本机 3306 可能已被占用，映射到 3307；应用侧 DATABASE_URL 用同一端口
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Go 检索服务：检索、入库分块、SSE 三个能力。
  # 后端通过 GO_RETRIEVAL_URL 调用它；未配置或不可用时 Python 会自动降级，
  # 因此这个服务不是应用的启动硬依赖。
  go-retrieval:
    build: ./go-retrieval
    container_name: ainew-retrieval
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Go 业务服务：订单查询、令牌校验、待确认工单列表（均为只读）。
  # 后端通过 GO_BUSINESS_URL 调用它；未配置或不可用时 Python 会自动降级。
  # 需要先启动过一次后端生成 backend/app.db，否则宿主机路径不存在时
  # Docker 会把它创建成目录，只读挂载会失败。
  go-business:
    build: ./go-business
    container_name: ainew-business
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8082
      DB_PATH: /data/app.db
      AI_NEW_JWT_SECRET: ${AI_NEW_JWT_SECRET:-}
      AI_NEW_JWT_LEEWAY: ${AI_NEW_JWT_LEEWAY:-30}
    volumes:
      # 与 Python 后端共用同一份 SQLite。
      # 必须可写：工单的 confirm / cancel / update_status 已在 Go 侧执行，
      # 写连接是 mode=rw；查询仍走另一条 mode=ro 的只读连接。
      - ./backend/app.db:/data/app.db:rw
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Go 网关：对外统一入口（反向代理、入口鉴权、限流、SSE 转发、pprof）。
  # 不启动也能直接访问 Python 的 8000 端口；这里把它作为默认入口。
  # Python 后端仍在宿主机运行，容器内通过 host.docker.internal 访问它。
  gateway:
    build: ./go-gateway
    container_name: ainew-gateway
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8080
      BACKEND_URL: http://host.docker.internal:8000
      RETRIEVAL_URL: http://go-retrieval:8081
      GO_BUSINESS_URL: http://go-business:8082
      GATEWAY_PPROF: "1"
      GATEWAY_FRONTEND_DIR: /frontend
      GATEWAY_GO_PENDING_TICKETS: ${GATEWAY_GO_PENDING_TICKETS:-false}
      GATEWAY_GO_TICKET_WRITES: ${GATEWAY_GO_TICKET_WRITES:-false}
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/frontend:ro
    extra_hosts:
      # Linux 上 Docker 默认没有 host.docker.internal，需显式映射到宿主机网关
      - "host.docker.internal:host-gateway"
    depends_on:
      - go-retrieval
      - go-business
    healthcheck:
      # 上游不可达时 /health 仍返回 200（status: degraded），
      # 这里检测的是网关自身是否存活；上游状态在响应体里。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mysql-data:
