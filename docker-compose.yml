x-mysql-client: &mysql-client
  DB_DRIVER: mysql
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:-ainew}
  MYSQL_USER: ${MYSQL_USER:-ainew}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ainew}

services:
  mysql:
    image: mysql:8.0
    container_name: ainew-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ainew}
      MYSQL_USER: ${MYSQL_USER:-ainew}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ainew}
    ports:
      # 本机 3306 可能已被占用，映射到 3307；应用侧 DATABASE_URL 用同一端口
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysql --protocol=tcp -h 127.0.0.1 -u "$$MYSQL_USER" --password="$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Go 检索服务：检索、入库分块、SSE 三个能力。
  # 后端通过 GO_RETRIEVAL_URL 调用它；未配置或不可用时 Python 会自动降级，
  # 因此这个服务不是应用的启动硬依赖。
  go-retrieval:
    build: ./go-retrieval
    container_name: ainew-retrieval
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *mysql-client
      DATABASE_URL: ""
      AI_NEW_JWT_SECRET: ${AI_NEW_JWT_SECRET:-}
      AI_NEW_JWT_LEEWAY: ${AI_NEW_JWT_LEEWAY:-30}
      AI_NEW_JWT_TTL: ${AI_NEW_JWT_TTL:-1800}
      AI_NEW_JWT_REFRESH_TTL: ${AI_NEW_JWT_REFRESH_TTL:-2592000}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      GO_RETRIEVAL_URL: http://go-retrieval:8081
      GO_BUSINESS_URL: http://go-business:8082
      RETRIEVAL_SETTINGS_PATH: /data/retrieval_settings.json
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - retrieval-settings:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  go-business:
    build: ./go-business
    container_name: ainew-business
    restart: unless-stopped
    environment:
      <<: *mysql-client
      ADDR: 0.0.0.0:8082
      RETRIEVAL_SETTINGS_PATH: /data/retrieval_settings.json
      RETRIEVAL_PREFETCH_FLOOR: ${RETRIEVAL_PREFETCH_FLOOR:-50}
      RETRIEVAL_PREFETCH_MULTIPLIER: ${RETRIEVAL_PREFETCH_MULTIPLIER:-5}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      RETRIEVAL_VECTOR_WEIGHT: ${RETRIEVAL_VECTOR_WEIGHT:-0.7}
      RETRIEVAL_KEYWORD_WEIGHT: ${RETRIEVAL_KEYWORD_WEIGHT:-0.3}
      RETRIEVAL_MMR_LAMBDA: ${RETRIEVAL_MMR_LAMBDA:-0.7}
      AI_NEW_JWT_SECRET: ${AI_NEW_JWT_SECRET:-}
      AI_NEW_JWT_LEEWAY: ${AI_NEW_JWT_LEEWAY:-30}
      AI_NEW_JWT_TTL: ${AI_NEW_JWT_TTL:-1800}
      AI_NEW_JWT_REFRESH_TTL: ${AI_NEW_JWT_REFRESH_TTL:-2592000}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      AGENT_INTERNAL_URL: ${AGENT_INTERNAL_URL:-http://backend:8000}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - retrieval-settings:/data
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Go 网关：对外统一入口（反向代理、入口鉴权、限流、SSE 转发、pprof）。
  gateway:
    build: ./go-gateway
    container_name: ainew-gateway
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8080
      BACKEND_URL: http://backend:8000
      RETRIEVAL_URL: http://go-retrieval:8081
      GO_BUSINESS_URL: http://go-business:8082
      GATEWAY_PPROF: "1"
      GATEWAY_FRONTEND_DIR: /frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/frontend:ro
    depends_on:
      - go-retrieval
      - go-business
    healthcheck:
      # 上游不可达时 /health 仍返回 200（status: degraded），
      # 这里检测的是网关自身是否存活；上游状态在响应体里。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mysql-data:
  retrieval-settings:
