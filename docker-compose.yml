services:
  mysql:
    image: mysql:8.0
    container_name: ainew-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ainew}
      MYSQL_USER: ${MYSQL_USER:-ainew}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ainew}
    ports:
      # 本机 3306 可能已被占用，映射到 3307；应用侧 DATABASE_URL 用同一端口
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Go 检索服务：检索、入库分块、SSE 三个能力。
  # 后端通过 GO_RETRIEVAL_URL 调用它；未配置或不可用时 Python 会自动降级，
  # 因此这个服务不是应用的启动硬依赖。
  go-retrieval:
    build: ./go-retrieval
    container_name: ainew-retrieval
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Go 与 Python 写同一份 SQLite，需共享数据库文件及其日志所在目录。
  # 如果用独立目录，通过 SQLITE_DATA_DIR 指向该目录，同时配置 Python 的 DATABASE_URL。
  go-business:
    build: ./go-business
    container_name: ainew-business
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8082
      DB_PATH: /data/app.db
      RETRIEVAL_SETTINGS_PATH: /data/retrieval_settings.json
      RETRIEVAL_PREFETCH_FLOOR: ${RETRIEVAL_PREFETCH_FLOOR:-50}
      RETRIEVAL_PREFETCH_MULTIPLIER: ${RETRIEVAL_PREFETCH_MULTIPLIER:-5}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      RETRIEVAL_VECTOR_WEIGHT: ${RETRIEVAL_VECTOR_WEIGHT:-0.7}
      RETRIEVAL_KEYWORD_WEIGHT: ${RETRIEVAL_KEYWORD_WEIGHT:-0.3}
      RETRIEVAL_MMR_LAMBDA: ${RETRIEVAL_MMR_LAMBDA:-0.7}
      AI_NEW_JWT_SECRET: ${AI_NEW_JWT_SECRET:-}
      AI_NEW_JWT_LEEWAY: ${AI_NEW_JWT_LEEWAY:-30}
      AI_NEW_JWT_TTL: ${AI_NEW_JWT_TTL:-1800}
      AI_NEW_JWT_REFRESH_TTL: ${AI_NEW_JWT_REFRESH_TTL:-2592000}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      AGENT_INTERNAL_URL: ${AGENT_INTERNAL_URL:-http://host.docker.internal:8000}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${SQLITE_DATA_DIR:-./backend}:/data:rw
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Go 网关：对外统一入口（反向代理、入口鉴权、限流、SSE 转发、pprof）。
  # 不启动也能直接访问 Python 的 8000 端口；这里把它作为默认入口。
  # Python 后端仍在宿主机运行，容器内通过 host.docker.internal 访问它。
  gateway:
    build: ./go-gateway
    container_name: ainew-gateway
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8080
      BACKEND_URL: http://host.docker.internal:8000
      RETRIEVAL_URL: http://go-retrieval:8081
      GO_BUSINESS_URL: http://go-business:8082
      GATEWAY_PPROF: "1"
      GATEWAY_FRONTEND_DIR: /frontend
      GATEWAY_GO_PRIMARY: ${GATEWAY_GO_PRIMARY:-false}
      GATEWAY_GO_PENDING_TICKETS: ${GATEWAY_GO_PENDING_TICKETS:-}
      GATEWAY_GO_TICKET_WRITES: ${GATEWAY_GO_TICKET_WRITES:-}
      GATEWAY_GO_TICKET_CREATE: ${GATEWAY_GO_TICKET_CREATE:-}
      GATEWAY_GO_CHAT: ${GATEWAY_GO_CHAT:-}
      GATEWAY_GO_SESSION_REFRESH: ${GATEWAY_GO_SESSION_REFRESH:-}
      GATEWAY_GO_LOGIN: ${GATEWAY_GO_LOGIN:-}
      GATEWAY_GO_SESSION_REVOCATION: ${GATEWAY_GO_SESSION_REVOCATION:-}
      GATEWAY_GO_BUSINESS_API: ${GATEWAY_GO_BUSINESS_API:-}
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/frontend:ro
    extra_hosts:
      # Linux 上 Docker 默认没有 host.docker.internal，需显式映射到宿主机网关
      - "host.docker.internal:host-gateway"
    depends_on:
      - go-retrieval
      - go-business
    healthcheck:
      # 上游不可达时 /health 仍返回 200（status: degraded），
      # 这里检测的是网关自身是否存活；上游状态在响应体里。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mysql-data:
