services:
  mysql:
    image: mysql:8.0
    container_name: ainew-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ainew}
      MYSQL_USER: ${MYSQL_USER:-ainew}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ainew}
    ports:
      # 本机 3306 可能已被占用，映射到 3307；应用侧 DATABASE_URL 用同一端口
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Go 检索服务：检索、入库分块、SSE 三个能力。
  # 后端通过 GO_RETRIEVAL_URL 调用它；未配置或不可用时 Python 会自动降级，
  # 因此这个服务不是应用的启动硬依赖。
  go-retrieval:
    build: ./go-retrieval
    container_name: ainew-retrieval
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mysql-data:
