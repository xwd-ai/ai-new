<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 客服与工单助手</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-2: #f7f9fc;
      --text: #1a1d27;
      --muted: #8a919f;
      --muted-2: #b4bac6;
      --primary: #4f6ef7;
      --primary-soft: #eef1fe;
      --primary-grad: linear-gradient(135deg, #4f6ef7 0%, #7a5cf0 100%);
      --border: #e9edf3;
      --ok: #2ec27e;
      --ok-soft: #e8f8f0;
      --warn: #f5a623;
      --warn-soft: #fdf3e2;
      --danger: #f0525c;
      --danger-soft: #fdecee;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(20, 30, 60, .04), 0 8px 24px rgba(20, 30, 60, .06);
      --shadow-lg: 0 4px 12px rgba(20, 30, 60, .08), 0 16px 40px rgba(20, 30, 60, .10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      height: 100vh;
    }

    /* ---------- 左侧：会话列表 ---------- */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
    .brand .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--primary-grad); display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 4px 10px rgba(79,110,247,.35);
    }
    .brand .name { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
    .brand .ver { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .new-chat {
      border: none; background: var(--primary-grad); color: #fff;
      border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 12px rgba(79,110,247,.30);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .new-chat:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,110,247,.40); }
    .new-chat:active { transform: translateY(0); }

    .conv-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .conv-list .title { font-size: 11px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .8px; padding: 4px 6px; }
    .conv {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 10px; cursor: pointer; transition: background .15s ease;
    }
    .conv:hover { background: var(--surface-2); }
    .conv.active { background: var(--primary-soft); }
    .conv .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #ffb86c, #ff7a59); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
    }
    .conv .meta { flex: 1; min-width: 0; }
    .conv .meta .who { font-size: 13px; font-weight: 600; }
    .conv .meta .preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv .time { font-size: 11px; color: var(--muted-2); flex-shrink: 0; }
    .conv .badge {
      background: var(--danger); color: #fff; font-size: 11px; font-weight: 600;
      min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px;
    }

    /* ---------- 中间：聊天区 ---------- */
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 14px 22px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .topbar .cust-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #ffb86c, #ff7a59); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; flex-shrink: 0;
    }
    .topbar .cust-name { font-size: 15px; font-weight: 700; }
    .topbar .cust-status { font-size: 12px; color: var(--ok); display: flex; align-items: center; gap: 5px; }
    .topbar .cust-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .topbar .spacer { flex: 1; }
    .topbar .tag {
      font-size: 12px; padding: 5px 11px; border-radius: 20px;
      background: var(--primary-soft); color: var(--primary); font-weight: 600;
    }

    .chat-scroll { flex: 1; overflow-y: auto; padding: 24px 22px; }
    .chat-scroll .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    .msg { display: flex; gap: 12px; max-width: 100%; animation: fadeUp .35s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #fff;
    }
    .msg.ai .avatar { background: var(--primary-grad); }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .avatar { background: linear-gradient(135deg, #ffb86c, #ff7a59); }
    .msg .body { display: flex; flex-direction: column; gap: 8px; max-width: 78%; }
    .msg.user .body { align-items: flex-end; }
    .bubble {
      padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.65;
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--primary-grad); color: #fff; border: none; border-bottom-right-radius: 4px; box-shadow: 0 6px 18px rgba(79,110,247,.30); }
    .msg.ai .bubble { border-bottom-left-radius: 4px; }

    /* 步骤时间线 */
    .steps-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow); max-width: 100%;
    }
    .steps-card .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--text); }
    .steps-card .card-head .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .timeline { display: flex; flex-direction: column; }
    .tstep { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
    .tstep:last-child { padding-bottom: 0; }
    .tstep .rail { display: flex; flex-direction: column; align-items: center; width: 22px; flex-shrink: 0; }
    .tstep .node {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      background: var(--surface-2); border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted-2);
      transition: all .25s ease; z-index: 1;
    }
    .tstep .line { width: 2px; flex: 1; background: var(--border); margin: 3px 0; transition: background .25s ease; }
    .tstep:last-child .line { display: none; }
    .tstep.done .node { background: var(--ok); border-color: var(--ok); color: #fff; }
    .tstep.done .line { background: var(--ok); }
    .tstep.running .node { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
    .tstep .tlabel { padding-top: 2px; }
    .tstep .tlabel .t-name { font-size: 13px; font-weight: 600; }
    .tstep .tlabel .t-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tstep .tstate { margin-left: auto; font-size: 12px; color: var(--muted-2); padding-top: 3px; }
    .tstep.done .tstate { color: var(--ok); }
    .tstep.running .tstate { color: var(--primary); }

    /* 工单卡片 */
    .ticket-card {
      background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--primary);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    }
    .ticket-card .tc-head {
      display: flex; align-items: center; gap: 8px; padding: 12px 16px;
      background: var(--primary-soft); font-size: 13px; font-weight: 700; color: var(--primary);
    }
    .ticket-card .tc-head .spacer { flex: 1; }
    .ticket-card .tc-status {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
      background: var(--warn-soft); color: var(--warn);
    }
    .ticket-card .tc-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .tc-row { display: flex; gap: 10px; font-size: 13px; }
    .tc-row .k { color: var(--muted); flex-shrink: 0; width: 68px; }
    .tc-row .v { color: var(--text); flex: 1; line-height: 1.55; }
    .tc-ref { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--primary); cursor: pointer; }
    .tc-ref:hover { border-color: var(--primary); }

    /* 输入区 */
    .composer {
      padding: 14px 22px 18px; background: var(--surface); border-top: 1px solid var(--border);
    }
    .composer .inner { max-width: 760px; margin: 0 auto; }
    .composer .box {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 12px; transition: border-color .15s ease, box-shadow .15s ease;
    }
    .composer .box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.12); background: var(--surface); }
    .composer textarea {
      flex: 1; border: none; background: transparent; resize: none; outline: none;
      font-size: 14px; font-family: inherit; line-height: 1.6; color: var(--text);
      max-height: 120px; padding: 4px 2px;
    }
    .composer .send {
      width: 40px; height: 40px; border-radius: 12px; border: none; flex-shrink: 0;
      background: var(--primary-grad); color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(79,110,247,.30);
      transition: transform .12s ease;
    }
    .composer .send:hover { transform: translateY(-1px); }
    .composer .send:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .composer .hint { font-size: 12px; color: var(--muted-2); margin-top: 8px; text-align: center; }

    /* ---------- 右侧：上下文面板 ---------- */
    .aside {
      background: var(--surface); border-left: 1px solid var(--border);
      padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;
    }
    .aside .a-title { font-size: 13px; font-weight: 700; }
    .info-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .info-card .i-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; }
    .info-card .i-row .ik { color: var(--muted); }
    .info-card .i-row .iv { font-weight: 600; text-align: right; }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
    .pill.pro { background: var(--primary-soft); color: var(--primary); }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }

    .suggestion {
      border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
      padding: 10px 12px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all .15s ease;
    }
    .suggestion:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

    @media (max-width: 1080px) {
      .layout { grid-template-columns: 220px 1fr; }
      .aside { display: none; }
    }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 左侧会话列表 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">AI</div>
        <div>
          <div class="name">客服工作台</div>
          <div class="ver">工单助手 · Demo</div>
        </div>
      </div>
      <button class="new-chat" onclick="newChat()">＋ 新建会话</button>
      <div class="conv-list">
        <div class="title">最近会话</div>
        <div class="conv active" id="conv0" onclick="switchConv(this)">
          <div class="avatar">李</div>
          <div class="meta">
            <div class="who">李女士</div>
            <div class="preview">专业版导出功能一直失败…</div>
          </div>
          <span class="badge">2</span>
        </div>
        <div class="conv" onclick="switchConv(this)">
          <div class="avatar">王</div>
          <div class="meta">
            <div class="who">王先生</div>
            <div class="preview">退款申请怎么操作？</div>
          </div>
          <span class="time">10:24</span>
        </div>
        <div class="conv" onclick="switchConv(this)">
          <div class="avatar">张</div>
          <div class="meta">
            <div class="who">张先生</div>
            <div class="preview">激活码输入提示无效</div>
          </div>
          <span class="time">昨天</span>
        </div>
      </div>
    </aside>

    <!-- 中间聊天 -->
    <main class="main">
      <div class="topbar">
        <div class="cust-avatar">李</div>
        <div>
          <div class="cust-name">李女士</div>
          <div class="cust-status">在线 · 专业版</div>
        </div>
        <div class="spacer"></div>
        <span class="tag">工单 #T-1024</span>
      </div>

      <div class="chat-scroll">
        <div class="inner" id="chatLog">
          <div class="msg ai">
            <div class="avatar">AI</div>
            <div class="body">
              <div class="bubble">您好，我是智能客服小助手 👋<br>有什么可以帮到您？比如：<br>· 功能使用问题<br>· 导出 / 激活 / 升级<br>· 提交工单</div>
            </div>
          </div>
        </div>
      </div>

      <div class="composer">
        <div class="inner">
          <div class="box">
            <textarea id="msgInput" rows="1" placeholder="输入问题，例如：专业版导出功能一直失败"></textarea>
            <button class="send" id="sendBtn" title="发送">➤</button>
          </div>
          <div class="hint">输入示例问题，即可看到完整排查流程</div>
        </div>
      </div>
    </main>

    <!-- 右侧上下文面板 -->
    <aside class="aside">
      <div class="a-title">客户信息</div>
      <div class="info-card">
        <div class="i-row"><span class="ik">姓名</span><span class="iv">李女士</span></div>
        <div class="i-row"><span class="ik">产品</span><span class="iv"><span class="pill pro">专业版</span></span></div>
        <div class="i-row"><span class="ik">订单状态</span><span class="iv"><span class="pill ok">服务期内</span></span></div>
        <div class="i-row"><span class="ik">到期时间</span><span class="iv">2027-03-15</span></div>
      </div>

      <div class="a-title">快捷提问</div>
      <div class="suggestion" onclick="fillAndSend('专业版导出功能一直失败')">专业版导出功能一直失败</div>
      <div class="suggestion" onclick="fillAndSend('激活码输入提示无效')">激活码输入提示无效</div>
      <div class="suggestion" onclick="fillAndSend('怎么申请退款')">怎么申请退款</div>
    </aside>
  </div>

  <script>
    const log = document.getElementById('chatLog');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    const STEPS = [
      { name: '理解问题并追问', desc: '澄清版本、页面与报错信息' },
      { name: '查询订单与服务范围', desc: '确认专业版且在服务期内' },
      { name: '检索手册给出建议', desc: '命中《导出功能排查指南》' },
      { name: '确认并创建工单', desc: '生成工单 T-1024' },
    ];

    function scrollBottom() { const s = document.querySelector('.chat-scroll'); s.scrollTop = s.scrollHeight; }

    function addUserMsg(text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg user';
      wrap.innerHTML = `<div class="avatar">客</div><div class="body"><div class="bubble"></div></div>`;
      wrap.querySelector('.bubble').textContent = text;
      log.appendChild(wrap);
      scrollBottom();
    }

    function addAiContainer() {
      const wrap = document.createElement('div');
      wrap.className = 'msg ai';
      wrap.innerHTML = `<div class="avatar">AI</div><div class="body"></div>`;
      log.appendChild(wrap);
      scrollBottom();
      return wrap.querySelector('.body');
    }

    function iconFor(name) {
      if (name.includes('理解')) return '问';
      if (name.includes('订单')) return '单';
      if (name.includes('检索')) return '书';
      return '✓';
    }

    function addSteps(body) {
      const card = document.createElement('div');
      card.className = 'steps-card';
      card.innerHTML = `<div class="card-head"><span class="pulse"></span>正在为您排查</div>`;
      const tl = document.createElement('div');
      tl.className = 'timeline';
      STEPS.forEach(s => {
        const el = document.createElement('div');
        el.className = 'tstep';
        el.innerHTML = `<div class="rail"><div class="node">${iconFor(s.name)}</div><div class="line"></div></div>
          <div class="tlabel"><div class="t-name">${s.name}</div><div class="t-desc">${s.desc}</div></div>
          <div class="tstate">待执行</div>`;
        tl.appendChild(el);
      });
      card.appendChild(tl);
      body.appendChild(card);
      scrollBottom();
      return tl;
    }

    function setStep(tl, i, state) {
      const el = tl.children[i];
      if (!el) return;
      el.classList.remove('running', 'done');
      if (state === 'running') { el.classList.add('running'); el.querySelector('.tstate').textContent = '执行中'; }
      else if (state === 'done') { el.classList.add('done'); el.querySelector('.tstate').textContent = '完成'; }
    }

    function addBubble(body, text) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = text;
      body.appendChild(b);
      scrollBottom();
      return b;
    }

    function addTicketCard(body) {
      const card = document.createElement('div');
      card.className = 'ticket-card';
      card.innerHTML = `
        <div class="tc-head"><span>📋 工单已创建</span><span class="spacer"></span><span class="tc-status">待处理</span></div>
        <div class="tc-body">
          <div class="tc-row"><span class="k">问题</span><span class="v">专业版导出功能一直失败</span></div>
          <div class="tc-row"><span class="k">已尝试</span><span class="v">重启客户端 · 检查网络连接</span></div>
          <div class="tc-row"><span class="k">依据</span><span class="v"><span class="tc-ref">📄 产品手册《导出功能排查指南》</span></span></div>
          <div class="tc-row"><span class="k">工单号</span><span class="v">#T-1024</span></div>
        </div>`;
      body.appendChild(card);
      scrollBottom();
    }

    async function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      addUserMsg(text);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      const body = addAiContainer();
      const tl = addSteps(body);

      for (let i = 0; i < STEPS.length; i++) {
        setStep(tl, i, 'running');
        await new Promise(r => setTimeout(r, 750));
        setStep(tl, i, 'done');
        await new Promise(r => setTimeout(r, 250));
      }

      let reply = '';
      try {
        const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
        const data = await res.json();
        reply = data.reply;
      } catch (e) { /* 离线演示不阻塞 */ }

      addBubble(body, '根据排查，建议您：\n1. 升级到最新专业版客户端\n2. 检查导出目录是否有写入权限\n3. 若仍失败，可为您提交工单处理');
      addTicketCard(body);
      sendBtn.disabled = false;
      scrollBottom();
    }

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }
    input.addEventListener('input', autoResize);
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
    sendBtn.addEventListener('click', handleSend);

    function fillAndSend(t) { input.value = t; handleSend(); }
    function newChat() { log.innerHTML = ''; input.focus(); }
    function switchConv(el) { document.querySelectorAll('.conv').forEach(c => c.classList.remove('active')); el.classList.add('active'); }
  </script>
</body>
</html>
