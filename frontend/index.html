<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 客服与工单助手</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-2: #f7f9fc;
      --text: #1a1d27;
      --muted: #8a919f;
      --muted-2: #b4bac6;
      --primary: #4f6ef7;
      --primary-soft: #eef1fe;
      --primary-grad: linear-gradient(135deg, #4f6ef7 0%, #7a5cf0 100%);
      --border: #e9edf3;
      --ok: #2ec27e;
      --ok-soft: #e8f8f0;
      --warn: #f5a623;
      --warn-soft: #fdf3e2;
      --danger: #f0525c;
      --danger-soft: #fdecee;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(20, 30, 60, .04), 0 8px 24px rgba(20, 30, 60, .06);
      --shadow-lg: 0 4px 12px rgba(20, 30, 60, .08), 0 16px 40px rgba(20, 30, 60, .10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      grid-template-rows: minmax(0, 1fr);
      height: 100vh;
    }

    /* ---------- 左侧：会话列表 ---------- */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
    .brand .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--primary-grad); display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 4px 10px rgba(79,110,247,.35);
    }
    .brand .name { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
    .brand .ver { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .new-chat {
      border: none; background: var(--primary-grad); color: #fff;
      border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 12px rgba(79,110,247,.30);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .new-chat:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,110,247,.40); }
    .new-chat:active { transform: translateY(0); }

    .conv-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .conv-list .title { font-size: 11px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .8px; padding: 4px 6px; }
    .conv {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 10px; cursor: pointer; transition: background .15s ease;
    }
    .conv:hover { background: var(--surface-2); }
    .conv.active { background: var(--primary-soft); }
    .conv .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #ffb86c, #ff7a59); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
    }
    .conv .meta { flex: 1; min-width: 0; }
    .conv .meta .who { font-size: 13px; font-weight: 600; }
    .conv .meta .preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv .time { font-size: 11px; color: var(--muted-2); flex-shrink: 0; }
    .conv .badge {
      background: var(--danger); color: #fff; font-size: 11px; font-weight: 600;
      min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px;
    }

    /* ---------- 中间：聊天区 ---------- */
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 14px 22px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .topbar .cust-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #ffb86c, #ff7a59); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; flex-shrink: 0;
    }
    .topbar .cust-name { font-size: 15px; font-weight: 700; }
    .topbar .cust-status { font-size: 12px; color: var(--ok); display: flex; align-items: center; gap: 5px; }
    .topbar .cust-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .topbar .spacer { flex: 1; }
    .topbar .tag {
      font-size: 12px; padding: 5px 11px; border-radius: 20px;
      background: var(--primary-soft); color: var(--primary); font-weight: 600;
    }

    .chat-scroll { flex: 1; overflow-y: auto; padding: 24px 22px; }
    .chat-scroll .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    .msg { display: flex; gap: 12px; max-width: 100%; animation: fadeUp .35s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #fff;
    }
    .msg.ai .avatar { background: var(--primary-grad); }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .avatar { background: linear-gradient(135deg, #ffb86c, #ff7a59); }
    .msg .body { display: flex; flex-direction: column; gap: 8px; max-width: 78%; }
    .msg.user .body { align-items: flex-end; }
    .bubble {
      padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.65;
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--primary-grad); color: #fff; border: none; border-bottom-right-radius: 4px; box-shadow: 0 6px 18px rgba(79,110,247,.30); }
    .msg.ai .bubble { border-bottom-left-radius: 4px; }

    /* 步骤时间线 */
    .steps-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow); max-width: 100%;
    }
    .steps-card .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--text); }
    .steps-card .card-head .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .timeline { display: flex; flex-direction: column; }
    .tstep { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
    .tstep:last-child { padding-bottom: 0; }
    .tstep .rail { display: flex; flex-direction: column; align-items: center; width: 22px; flex-shrink: 0; }
    .tstep .node {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      background: var(--surface-2); border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted-2);
      transition: all .25s ease; z-index: 1;
    }
    .tstep .line { width: 2px; flex: 1; background: var(--border); margin: 3px 0; transition: background .25s ease; }
    .tstep:last-child .line { display: none; }
    .tstep.done .node { background: var(--ok); border-color: var(--ok); color: #fff; }
    .tstep.done .line { background: var(--ok); }
    .tstep.running .node { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
    .tstep .tlabel { padding-top: 2px; }
    .tstep .tlabel .t-name { font-size: 13px; font-weight: 600; }
    .tstep .tlabel .t-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tstep .tstate { margin-left: auto; font-size: 12px; color: var(--muted-2); padding-top: 3px; }
    .tstep.done .tstate { color: var(--ok); }
    .tstep.running .tstate { color: var(--primary); }

    .conversation-tickets { max-width: 760px; margin: 20px auto 0; display: grid; gap: 12px; }
    .conversation-tickets[hidden], .ticket-card [hidden] { display: none; }
    .ticket-card {
      width: min(100%, 640px); padding: 16px 18px; background: var(--surface);
      border: 1px solid #dee5f0; border-radius: 16px; box-shadow: 0 3px 12px #172b5210;
    }
    .ticket-card-head, .ticket-card-actions, .ticket-detail-header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    }
    .ticket-card-head, .ticket-detail-header { justify-content: space-between; }
    .ticket-identity { display: inline-flex; align-items: center; gap: 9px; color: #526079; font-size: 13px; }
    .ticket-icon {
      display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px;
      background: #edf1ff; color: #455cbe; flex-shrink: 0;
    }
    .ticket-icon svg { width: 17px; height: 17px; }
    .ticket-status {
      display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
      background: #eef2fb; color: #3d5076; padding: 5px 10px; font-size: 12px; font-weight: 650;
    }
    .ticket-status::before { content: ""; width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
    .ticket-status.is-resolved { background: #e8f7ee; color: #18603d; }
    .ticket-status.is-pending { background: #fff4dd; color: #805411; }
    .ticket-status.is-active { background: #eaf0ff; color: #304cae; }
    .ticket-status.is-closed { background: #eff1f5; color: #546074; }
    .ticket-card h3 { margin: 12px 0; font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; }
    .ticket-card-actions button, .ticket-detail-header button, .my-ticket-row button {
      border: 1px solid #dbe3fb; border-radius: 8px; background: #f5f7ff; color: #354baf;
      padding: 7px 11px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .ticket-card-actions button:hover, .ticket-detail-header button:hover, .my-ticket-row button:hover { background: #eaf0ff; }
    .ticket-card-detail, #ticketDetail {
      margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px;
      overflow-wrap: anywhere; font-size: 13px; color: #414e63;
    }
    .ticket-detail-header { margin-bottom: 6px; }
    .ticket-detail-header strong { color: #4b5972; font-size: 13px; }
    .ticket-detail-title { color: var(--text); font-size: 18px; line-height: 1.45; margin: 5px 0 14px; }
    .ticket-detail-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; }
    .ticket-detail-panel { min-width: 0; background: #f7f9fe; border: 1px solid #edf0f7; border-radius: 12px; padding: 12px; }
    .ticket-detail-panel h4 { font-size: 13px; color: #283552; margin: 0 0 9px; }
    .ticket-replies { display: grid; gap: 8px; }
    .ticket-reply { border: 1px solid #e6ecf7; background: white; padding: 10px; border-radius: 10px; }
    .ticket-reply-meta { color: #53617a; font-size: 12px; margin-bottom: 5px; font-weight: 600; }
    .ticket-reply-meta time { margin-left: 4px; font-weight: 400; }
    .ticket-reply p, .ticket-notes p { line-height: 1.6; white-space: pre-wrap; }
    .ticket-timeline { list-style: none; margin-left: 4px; }
    .ticket-timeline li { position: relative; display: grid; gap: 3px; padding: 0 0 12px 15px; border-left: 1px solid #ccd6ed; }
    .ticket-timeline li:last-child { padding-bottom: 0; border-color: transparent; }
    .ticket-timeline li::before {
      content: ""; position: absolute; left: -4px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: #a0afd6;
    }
    .ticket-timeline li.is-latest::before { background: var(--primary); box-shadow: 0 0 0 3px #e4eaff; }
    .ticket-timeline time { font-size: 11px; color: #596780; }
    .ticket-notes { margin-top: 12px; border: 1px solid #edf0f7; border-radius: 10px; padding: 10px 12px; }
    .ticket-notes summary { cursor: pointer; color: #435477; font-weight: 600; }
    .ticket-notes p { margin-top: 8px; }
    @media (max-width: 520px) { .ticket-detail-grid { grid-template-columns: 1fr; } .ticket-card { padding: 13px; } }

    /* 输入区 */
    .composer {
      position: relative;
      padding: 14px 22px 18px; background: var(--surface); border-top: 1px solid var(--border);
    }
    .jump-latest {
      position: absolute; right: 22px; bottom: calc(100% + 8px); z-index: 1;
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); color: var(--text); box-shadow: var(--shadow);
      font: inherit; font-size: 13px; cursor: pointer;
    }
    .composer .inner { max-width: 760px; margin: 0 auto; }
    .composer .box {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 12px; transition: border-color .15s ease, box-shadow .15s ease;
    }
    .composer .box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.12); background: var(--surface); }
    .composer textarea {
      flex: 1; border: none; background: transparent; resize: none; outline: none;
      font-size: 14px; font-family: inherit; line-height: 1.6; color: var(--text);
      max-height: 120px; padding: 4px 2px;
    }
    .composer .send {
      width: 40px; height: 40px; border-radius: 12px; border: none; flex-shrink: 0;
      background: var(--primary-grad); color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(79,110,247,.30);
      transition: transform .12s ease;
    }
    .composer .send:hover { transform: translateY(-1px); }
    .composer .send:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .composer .hint { font-size: 12px; color: var(--muted-2); margin-top: 8px; text-align: center; }

    /* ---------- 右侧：上下文面板 ---------- */
    .aside {
      background: var(--surface); border-left: 1px solid var(--border);
      padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;
    }
    .aside .a-title { font-size: 13px; font-weight: 700; }
    .info-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .info-card .i-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; }
    .info-card .i-row .ik { color: var(--muted); }
    .info-card .i-row .iv { font-weight: 600; text-align: right; }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
    .pill.pro { background: var(--primary-soft); color: var(--primary); }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }

    .suggestion {
      border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
      padding: 10px 12px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all .15s ease;
    }
    .suggestion:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

    .nav { margin-top: 6px; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px; padding: 10px 8px;
      border-top: 1px solid var(--border); margin-top: 4px;
    }
    .sidebar-user .avatar { background: linear-gradient(135deg,#4f6ef7,#7a5cf0); }
    .sidebar-user .meta { flex: 1; min-width: 0; }
    .sidebar-user .logout {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; font-size: 14px;
      transition: all .15s ease; flex-shrink: 0;
    }
    .sidebar-user .logout:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }

    /* 确认建单 */
    .confirm-ticket {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow);
    }
    .confirm-ticket .ct-text { font-size: 13.5px; margin-bottom: 12px; color: var(--text); }
    .confirm-ticket .ct-actions { display: flex; gap: 10px; }
    .ct-btn {
      padding: 9px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all .15s ease;
    }
    .ct-btn:hover { border-color: var(--primary); color: var(--primary); }
    .ct-btn.primary { background: var(--primary-grad); color: #fff; border: none; box-shadow: 0 4px 12px rgba(79,110,247,.30); }
    .ct-btn.primary:hover { transform: translateY(-1px); }
    .ct-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .ct-dismiss { font-size: 13px; color: var(--muted); }

    /* 引用来源 */
    .sources { display: flex; flex-direction: column; gap: 6px; }
    .sources .src-label { font-size: 11px; color: var(--muted-2); letter-spacing: .5px; }
    .sources .src-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .src-chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
      border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border);
      font-size: 12px; color: var(--primary); cursor: default;
    }

    /* 执行过程 */
    .trace {
      display: flex; flex-direction: column; gap: 4px;
      padding: 8px 10px; border-radius: 8px;
      background: var(--surface-2); border: 1px solid var(--border);
    }
    .trace-label { font-size: 11px; color: var(--muted-2); letter-spacing: .5px; margin-bottom: 2px; }
    .trace-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .trace-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .trace-dot.run { background: var(--primary); }
    .trace-dot.ok { background: #2f9e44; }
    .trace-dot.err { background: #e03131; }
    .trace-dot.warn { background: #e8890c; }

    .conversation-choice { width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
    #conversationList { max-height: 55vh; overflow: auto; }
    #conversationSelect { display: none; min-width: 0; max-width: 42%; }
    #ticketDetail { max-height: 42vh; overflow: auto; }
    .my-tickets { padding: 10px 22px; background: white; border-bottom: 1px solid var(--border); }
    .my-tickets summary { cursor: pointer; font-weight: 600; }
    #ticketListStatus { margin: 6px 0; color: var(--muted); font-size: 13px; }
    #ticketList { max-height: 28vh; overflow: auto; }
    .my-ticket-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 0; overflow-wrap: anywhere; }

    @media (max-width: 1080px) {
      .layout { grid-template-columns: 220px 1fr; }
      .aside { display: none; }
    }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      #conversationSelect { display: block; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 左侧会话列表 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">AI</div>
        <div>
          <div class="name">客服工作台</div>
          <div class="ver">工单助手</div>
        </div>
      </div>
      <div class="conv-list">
        <div class="title">我的会话</div>
        <div id="conversationList"></div>
      </div>

      <div class="sidebar-user">
        <div class="avatar" id="meAvatar">客</div>
        <div class="meta">
          <div class="who" id="meName">未登录</div>
          <div class="preview" id="meRole"></div>
        </div>
        <button class="logout" id="logoutBtn" title="退出登录">⏻</button>
      </div>
    </aside>

    <!-- 中间聊天 -->
    <main class="main">
      <div class="topbar">
        <div class="cust-avatar">AI</div>
        <div class="cust-name">智能客服</div>
        <select id="conversationSelect" aria-label="切换会话"></select>
        <button id="createConversation" type="button">新建会话</button>
      </div>

      <details class="my-tickets" id="myTickets">
        <summary>全部工单 <span id="ticketCount"></span></summary>
        <p id="ticketListStatus" role="status"></p>
        <div id="ticketList"></div>
        <div id="ticketDetail" hidden></div>
        <button id="refreshTickets" type="button">刷新工单</button>
        <button id="nextTickets" type="button" hidden>下一页</button>
      </details>

      <div style="padding:8px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:13px;color:var(--muted)">
        <span id="connectionStatus" role="status" aria-live="polite">正在同步历史…</span>
        <button id="syncHistory" type="button" style="margin-left:auto;white-space:nowrap">同步历史</button>
        <button id="cancelHistory" type="button" hidden style="white-space:nowrap">取消同步</button>
        <button id="copyUnsaved" type="button" hidden>复制未保存内容</button>
        <a id="reloginLink" href="/login" hidden style="white-space:nowrap">重新登录</a>
      </div>
      <div style="margin:0 22px;font-size:13px;color:var(--muted)">
        <div id="copyUnsavedStatus" role="status"></div>
        <textarea id="copyUnsavedText" aria-label="可手动复制的未保存内容" rows="4" readonly hidden style="width:100%;box-sizing:border-box"></textarea>
      </div>
      <div class="chat-scroll" tabindex="-1" role="region" aria-label="对话消息">
        <details id="uncertainQuestions" hidden style="max-width:760px;margin:0 auto 16px;color:var(--muted)">
          <summary>发送结果待核对（本页保留原文，请勿重复提交）</summary>
          <div id="uncertainTexts" style="white-space:pre-wrap;overflow-wrap:anywhere"></div>
        </details>
        <div class="inner" id="chatLog">
          <div class="msg ai">
            <div class="avatar">AI</div>
            <div class="body">
              <div class="bubble">您好，我是智能客服小助手 👋<br>有什么可以帮到您？比如：<br>· 功能使用问题<br>· 导出 / 激活 / 升级<br>· 提交工单</div>
            </div>
          </div>
        </div>
        <section id="conversationTickets" class="conversation-tickets" aria-label="当前会话的工单" hidden></section>
      </div>

      <div class="composer">
        <button id="jumpLatest" class="jump-latest" type="button" hidden>返回最新消息</button>
        <div class="inner">
          <div class="box">
            <textarea id="msgInput" rows="1" placeholder="输入问题，例如：专业版导出功能一直失败"></textarea>
            <button class="send" id="sendBtn" title="发送">➤</button>
          </div>
          <div class="hint">输入示例问题，即可看到完整排查流程</div>
        </div>
      </div>
    </main>

    <!-- 右侧上下文面板 -->
    <aside class="aside">
      <div class="a-title">客户信息</div>
      <div class="info-card" id="orderCard">
        <div class="i-row"><span class="ik">姓名</span><span class="iv" id="custName">—</span></div>
        <div class="i-row"><span class="ik">产品</span><span class="iv"><span class="pill pro" id="custProduct">—</span></span></div>
        <div class="i-row"><span class="ik">订单状态</span><span class="iv"><span class="pill ok" id="custStatus">—</span></span></div>
        <div class="i-row"><span class="ik">到期时间</span><span class="iv" id="custExpire">—</span></div>
      </div>

      <div class="a-title">快捷提问</div>
      <div class="suggestion" onclick="fillAndSend('专业版导出功能一直失败')">专业版导出功能一直失败</div>
      <div class="suggestion" onclick="fillAndSend('激活码输入提示无效')">激活码输入提示无效</div>
      <div class="suggestion" onclick="fillAndSend('怎么申请退款')">怎么申请退款</div>
    </aside>
  </div>

  <script src="/assets/chat-recovery.js"></script>
  <script>
    // ---- 登录守卫 ----
    const token = localStorage.getItem('token');
    const me = JSON.parse(localStorage.getItem('user') || 'null');
    if (!token || !me) {
      window.location.href = '/login';
    } else if (me.role === 'admin') {
      // 管理员应进入工单后台，而非客户对话页
      window.location.href = '/admin';
    }

    const log = document.getElementById('chatLog');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    // 显示当前用户
    document.getElementById('meName').textContent = me?.name || '未登录';
    document.getElementById('custName').textContent = me?.name || '未登录';
    document.getElementById('meRole').textContent = me?.role === 'admin' ? '管理员' : '用户';
    document.getElementById('meAvatar').textContent = (me?.name || '客').charAt(0);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login';
    });

    const chatScroll = document.querySelector('.chat-scroll');
    const jumpLatest = document.getElementById('jumpLatest');
    function scrollBottom() {
      chatScroll.scrollTop = chatScroll.scrollHeight;
      updateJumpLatest();
    }
    function isAtBottom() {
      return chatScroll.scrollHeight - chatScroll.clientHeight - chatScroll.scrollTop <= 2;
    }
    function updateJumpLatest() {
      jumpLatest.hidden = isAtBottom();
    }
    chatScroll.addEventListener('scroll', updateJumpLatest, {passive: true});
    window.addEventListener('resize', updateJumpLatest);
    jumpLatest.addEventListener('click', () => {
      chatScroll.focus({preventScroll: true});
      scrollBottom();
    });

    function addUserMsg(text, follow = true) {
      const wrap = document.createElement('div');
      wrap.className = 'msg user';
      wrap.innerHTML = `<div class="avatar">客</div><div class="body"><div class="bubble"></div></div>`;
      wrap.querySelector('.bubble').textContent = text;
      log.appendChild(wrap);
      if (follow) scrollBottom();
    }

    function addAiContainer(follow = true) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ai';
      wrap.innerHTML = `<div class="avatar">AI</div><div class="body"></div>`;
      log.appendChild(wrap);
      if (follow) scrollBottom();
      return wrap.querySelector('.body');
    }

    // 给 AI 容器加一个「正在输入」的气泡，拿到真实回复后替换掉
    function addTyping(body) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.style.color = 'var(--muted)';
      b.textContent = '正在思考…';
      body.appendChild(b);
      scrollBottom();
      return b;
    }

    function addBubble(body, text) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = text;
      body.appendChild(b);
      return b;
    }

    const ticketStatusText = {
      pending_confirm: '待确认', open: '待处理', in_progress: '处理中',
      resolved: '已解决', transferred_human: '已转人工', closed: '已关闭',
    };
    const ticketList = document.getElementById('ticketList');
    const ticketListStatus = document.getElementById('ticketListStatus');
    const nextTickets = document.getElementById('nextTickets');
    let ticketPage = 1;
    let ticketRequest = 0;

    async function ticketRequestJSON(path, body) {
      const headers = { Authorization: 'Bearer ' + token };
      const options = { headers };
      if (body) {
        headers['Content-Type'] = 'application/json';
        options.method = 'POST';
        options.body = JSON.stringify(body);
      }
      const res = await fetch(path, options);
      if (res.status === 401) requireRelogin('登录已失效，请重新登录。');
      if (!res.ok) throw new Error('工单请求失败');
      return res.json();
    }

    async function confirmTicket(id) {
      return (await ticketRequestJSON('/api/tickets/confirm', {ticket_id: id})).ticket;
    }

    const ticketDetail = document.getElementById('ticketDetail');
    const ticketDetailRequests = new WeakMap();

    async function showTicketDetail(id, target = ticketDetail) {
      const request = (ticketDetailRequests.get(target) || 0) + 1;
      ticketDetailRequests.set(target, request);
      target.hidden = false;
      target.textContent = '正在加载工单详情…';
      try {
        const {ticket} = await ticketRequestJSON('/api/tickets/' + encodeURIComponent(id));
        if (request !== ticketDetailRequests.get(target) || !canUseSession()) return;
        renderTicketDetail(target, ticket, () => {
          ticketDetailRequests.set(target, request + 1);
          target.replaceChildren();
          target.hidden = true;
        });
      } catch {
        if (request === ticketDetailRequests.get(target)) {
          target.textContent = loginRequired ? '请重新登录后查看详情。' : '工单详情加载失败，请重新打开。';
        }
      }
    }

    function ticketText(tag, text, className = '') {
      const element = document.createElement(tag);
      element.textContent = text;
      element.className = className;
      return element;
    }

    function ticketBadge(status) {
      const style = {
        resolved: 'is-resolved', pending_confirm: 'is-pending',
        closed: 'is-closed', open: 'is-active', in_progress: 'is-active',
        transferred_human: 'is-active',
      }[status] || '';
      return ticketText('span', ticketStatusText[status] || status, `ticket-status ${style}`);
    }

    function appendTicketTime(target, timestamp) {
      if (!timestamp) return;
      const time = new Date(timestamp * 1000);
      if (!Number.isFinite(time.getTime())) return;
      const display = new Intl.DateTimeFormat('zh-CN', {
        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
        ...(time.getFullYear() !== new Date().getFullYear() ? {year: 'numeric'} : {}),
      }).format(time);
      const element = ticketText('time', display);
      element.dateTime = time.toISOString();
      target.appendChild(element);
    }

    function renderTicketDetail(target, ticket, dismiss) {
      const header = document.createElement('div');
      header.className = 'ticket-detail-header';
      header.appendChild(ticketText('strong', `工单 #${ticket.id}`));
      header.appendChild(ticketBadge(ticket.status));
      const close = ticketText('button', '收起详情');
      close.type = 'button';
      close.addEventListener('click', dismiss);
      header.appendChild(close);
      const grid = document.createElement('div');
      grid.className = 'ticket-detail-grid';
      const replies = document.createElement('section');
      replies.className = 'ticket-detail-panel';
      replies.appendChild(ticketText('h4', '客服回复'));
      const messages = document.createElement('div');
      messages.className = 'ticket-replies';
      for (const reply of ticket.reply_timeline?.items || []) {
        const entry = document.createElement('div');
        entry.className = 'ticket-reply';
        const meta = ticketText('div', `${reply.replier}：`, 'ticket-reply-meta');
        appendTicketTime(meta, reply.at);
        entry.appendChild(meta);
        entry.appendChild(ticketText('p', reply.content));
        messages.appendChild(entry);
      }
      if (!messages.children.length) messages.appendChild(ticketText('p', '暂无回复'));
      replies.appendChild(messages);
      grid.appendChild(replies);
      const progress = document.createElement('section');
      progress.className = 'ticket-detail-panel';
      progress.appendChild(ticketText('h4', '处理进度'));
      const timeline = document.createElement('ol');
      timeline.className = 'ticket-timeline';
      const events = ticket.status_timeline || [];
      for (const [index, event] of events.entries()) {
        const entry = document.createElement('li');
        if (index === events.length - 1) entry.className = 'is-latest';
        entry.appendChild(ticketText('strong', ticketStatusText[event.to_status] || event.to_status));
        appendTicketTime(entry, event.changed_at);
        timeline.appendChild(entry);
      }
      if (events.length) progress.appendChild(timeline);
      else progress.appendChild(ticketText('p', '暂无流转记录'));
      grid.appendChild(progress);
      target.replaceChildren(header, ticketText('h4', ticket.description, 'ticket-detail-title'), grid);
      if (ticket.evidence || ticket.tried_steps) {
        const notes = document.createElement('details');
        notes.className = 'ticket-notes';
        notes.appendChild(ticketText('summary', '排查信息'));
        if (ticket.evidence) notes.appendChild(ticketText('p', '排查依据：' + ticket.evidence));
        if (ticket.tried_steps) notes.appendChild(ticketText('p', '已尝试步骤：' + ticket.tried_steps));
        target.appendChild(notes);
      }
    }

    function renderTicketRow(ticket) {
      const row = document.createElement('div');
      row.className = 'my-ticket-row';
      const label = document.createElement('span');
      label.textContent = `#${ticket.id} · ${ticketStatusText[ticket.status] || ticket.status} · ${ticket.description}`;
      row.appendChild(label);
      const detailButton = document.createElement('button');
      detailButton.type = 'button';
      detailButton.textContent = '查看详情';
      detailButton.addEventListener('click', () => {
        if (canUseSession()) showTicketDetail(ticket.id);
      });
      row.appendChild(detailButton);
      if (ticket.status === 'pending_confirm') {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = '确认提交';
        button.addEventListener('click', async () => {
          if (!canUseSession()) return;
          button.disabled = true;
          try {
            await confirmTicket(ticket.id);
            await loadTickets(ticketPage);
            refreshConversationTickets();
          } catch {
            ticketListStatus.textContent = '确认失败，请重试。';
            button.disabled = loginRequired;
          }
        });
        row.appendChild(button);
      }
      return row;
    }

    async function loadTickets(page = 1) {
      if (!token || !me || me.role === 'admin' || !canUseSession()) return;
      const request = ++ticketRequest;
      nextTickets.hidden = true;
      ticketListStatus.textContent = '正在加载工单…';
      try {
        const path = page === 1 ? '/api/tickets' : `/api/tickets?page=${page}`;
        const data = await ticketRequestJSON(path);
        if (request !== ticketRequest || !canUseSession()) return;
        ticketPage = data.page || 1;
        document.getElementById('ticketCount').textContent = `（${data.total}）`;
        ticketList.replaceChildren(...data.tickets.map(renderTicketRow));
        ticketListStatus.textContent = data.tickets.length
          ? `第 ${ticketPage} / ${data.pages} 页` : '暂无工单';
        nextTickets.hidden = !data.has_more;
      } catch {
        if (request !== ticketRequest) return;
        ticketListStatus.textContent = loginRequired ? '请重新登录后查看工单。' : '工单加载失败，请刷新重试。';
      }
    }

    document.getElementById('refreshTickets').addEventListener('click', () => loadTickets());
    nextTickets.addEventListener('click', () => loadTickets(ticketPage + 1));

    // 确认建单按钮（带来源依据）
    function addConfirmTicket(body, description, sources, selected) {
      const wrap = document.createElement('div');
      wrap.className = 'confirm-ticket';
      wrap.innerHTML = `
        <div class="ct-text">是否需要我为您创建工单，让人工客服跟进？</div>
        <div class="ct-actions">
          <button class="ct-btn primary">确认提交工单</button>
          <button class="ct-btn">暂不需要</button>
        </div>`;
      body.appendChild(wrap);
      scrollBottom();

      const [confirmBtn, cancelBtn] = wrap.querySelectorAll('.ct-btn');
      confirmBtn.disabled = loginRequired;
      confirmBtn.addEventListener('click', async () => {
        if (!canUseSession()) return;
        confirmBtn.disabled = true;
        confirmBtn.textContent = '创建中…';
        cancelBtn.disabled = true;
        let draft;
        try {
          const evidence = sources.map(source => source.title).join('；') || 'AI 客服建议';
          const data = await ticketRequestJSON('/api/tickets', {
            description, evidence, ...(selected ? {conversation_id: selected} : {}),
          });
          draft = data.ticket;
          const ticket = draft.status === 'pending_confirm' ? await confirmTicket(draft.id) : draft;
          wrap.innerHTML = '';
          if (!selected) body.appendChild(ticketCard(ticket));
        } catch {
          confirmBtn.disabled = loginRequired;
          cancelBtn.disabled = false;
          confirmBtn.textContent = '重试提交工单';
          wrap.querySelector('.ct-text').textContent = draft
            ? '草稿已保存，可重试或从工单卡片确认。'
            : '提交结果未确认，请重试或刷新「全部工单」。';
        }
        if (draft && selected === conversationID && selected) refreshConversationTickets();
        await loadTickets();
      });
      cancelBtn.addEventListener('click', () => {
        wrap.innerHTML = `<div class="ct-dismiss">好的，如后续需要可随时让我创建工单。</div>`;
      });
    }

    const conversationTickets = document.getElementById('conversationTickets');
    let conversationTicketRequest = 0;

    function ticketCard(ticket) {
      const card = document.createElement('article');
      card.className = 'ticket-card';
      const header = document.createElement('div');
      header.className = 'ticket-card-head';
      const identity = document.createElement('div');
      identity.className = 'ticket-identity';
      const icon = document.createElement('span');
      icon.className = 'ticket-icon';
      icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>';
      identity.appendChild(icon);
      identity.appendChild(ticketText('span', `工单 #${ticket.id}`));
      header.appendChild(identity);
      header.appendChild(ticketBadge(ticket.status));
      const title = document.createElement('h3');
      title.textContent = ticket.description;
      const actions = document.createElement('div');
      actions.className = 'ticket-card-actions';
      const detail = document.createElement('div');
      detail.className = 'ticket-card-detail';
      detail.hidden = true;
      const view = document.createElement('button');
      view.type = 'button';
      view.textContent = '查看详情';
      view.addEventListener('click', () => {
        if (canUseSession()) showTicketDetail(ticket.id, detail);
      });
      actions.appendChild(view);
      if (ticket.status === 'pending_confirm') {
        const submit = document.createElement('button');
        submit.type = 'button';
        submit.textContent = '确认提交';
        const feedback = document.createElement('span');
        feedback.setAttribute('role', 'status');
        submit.addEventListener('click', async () => {
          if (!canUseSession()) return;
          submit.disabled = true;
          try {
            await confirmTicket(ticket.id);
            refreshConversationTickets();
            loadTickets();
          } catch {
            feedback.textContent = '提交失败，请重试。';
            submit.disabled = loginRequired;
          }
        });
        actions.appendChild(submit);
        actions.appendChild(feedback);
      }
      for (const part of [header, title, actions, detail]) card.appendChild(part);
      return card;
    }

    async function refreshConversationTickets(page = 1) {
      const selected = conversationID;
      const request = ++conversationTicketRequest;
      if (!selected || !canUseSession()) return;
      try {
        const {tickets, has_more: hasMore} = await ticketRequestJSON(
          `/api/tickets?conversation_id=${encodeURIComponent(selected)}&page=${page}`
        );
        if (request !== conversationTicketRequest || selected !== conversationID || !canUseSession()) return;
        const cards = tickets.map(ticketCard);
        if (page === 1) conversationTickets.replaceChildren(...cards);
        else for (const card of cards) conversationTickets.appendChild(card);
        if (hasMore) {
          const more = document.createElement('button');
          more.type = 'button';
          more.textContent = '查看更多工单';
          more.addEventListener('click', () => {
            more.remove();
            refreshConversationTickets(page + 1);
          });
          conversationTickets.appendChild(more);
        }
        conversationTickets.hidden = !conversationTickets.children.length;
      } catch {
        if (request !== conversationTicketRequest || selected !== conversationID || !canUseSession()) return;
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = '工单读取失败，点击重试';
        retry.addEventListener('click', () => {
          retry.remove();
          refreshConversationTickets(page);
        });
        conversationTickets.appendChild(retry);
        conversationTickets.hidden = false;
      }
    }

    // 展示执行过程：把后端返回的事件渲染成一串步骤卡片
    // 事件是「系统做过什么」的记录，与最终回答分开显示
    function addTrace(body, trace) {
      if (!trace || !trace.length) return;
      // 只展示有实质动作的事件，step 本身没信息量
      const items = trace.filter(e => e.kind === 'action' || e.kind === 'observe' || e.kind === 'error' || e.kind === 'stopped');
      if (!items.length) return;

      const wrap = document.createElement('div');
      wrap.className = 'trace';
      const label = document.createElement('div');
      label.className = 'trace-label';
      label.textContent = '执行过程';
      wrap.appendChild(label);

      items.forEach(e => {
        const row = document.createElement('div');
        row.className = 'trace-row';
        if (e.kind === 'action') {
          row.innerHTML = '<span class="trace-dot run"></span>' + '检索知识库：' + escapeHtml(e.query || '');
        } else if (e.kind === 'observe') {
          const n = e.count || 0;
          row.innerHTML = '<span class="trace-dot ok"></span>' + (n > 0 ? '找到 ' + n + ' 条相关资料' : '未找到相关资料');
        } else if (e.kind === 'error') {
          row.innerHTML = '<span class="trace-dot err"></span>' + escapeHtml(e.message || '执行出错');
        } else if (e.kind === 'stopped') {
          row.innerHTML = '<span class="trace-dot warn"></span>' + escapeHtml(e.reason || '已停止');
        }
        wrap.appendChild(row);
      });

      body.appendChild(wrap);
      scrollBottom();
    }

    // 展示 AI 回答引用的知识来源
    function addSources(body, sources) {
      if (!sources || !sources.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'sources';
      wrap.innerHTML = '<div class="src-label">参考来源</div>';
      const list = document.createElement('div');
      list.className = 'src-list';
      const kindText = { manual: '手册', faq: 'FAQ', rule: '规则' };
      sources.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'src-chip';
        chip.textContent = `${kindText[s.kind] || '资料'} · ${s.title}`;
        list.appendChild(chip);
      });
      wrap.appendChild(list);
      body.appendChild(wrap);
      scrollBottom();
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // 当前对话命中的知识来源（供建单时沉淀为「依据」）
    let renderedHistory = null;

    const syncBtn = document.getElementById('syncHistory');
    const connectionStatus = document.getElementById('connectionStatus');
    const copyUnsaved = document.getElementById('copyUnsaved');
    const copyStatus = document.getElementById('copyUnsavedStatus');
    const manualCopy = document.getElementById('copyUnsavedText');
    let copyRevision = 0;
    let pageActive = true;
    let loginRequired = false;
    const canUseSession = () => pageActive && !loginRequired;

    function showStatus(text) {
      if (loginRequired) return;
      const follow = isAtBottom();
      connectionStatus.textContent = text;
      if (follow) scrollBottom();
      else updateJumpLatest();
    }

    function updateControls(busy) {
      sendBtn.disabled = busy || loginRequired || creatingConversation || loadingConversations;
      createConversationButton.disabled = recovery.sending || loginRequired || creatingConversation || loadingConversations;
      syncBtn.disabled = busy || loginRequired;
      document.getElementById('cancelHistory').hidden = !recovery.syncing;
    }

    function requireRelogin(message) {
      if (loginRequired) return;
      loginRequired = true;
      recovery.cancelSync();
      updateControls(false);
      for (const button of log.querySelectorAll('.ct-btn.primary')) button.disabled = true;
      copyUnsaved.hidden = false;
      document.getElementById('reloginLink').hidden = false;
      connectionStatus.textContent = message;
      updateJumpLatest();
    }

    function clearCopyFeedback() {
      if (!loginRequired) return;
      copyRevision++;
      copyStatus.textContent = '';
      manualCopy.hidden = true;
      manualCopy.value = '';
    }

    copyUnsaved.addEventListener('click', async () => {
      if (!pageActive || !loginRequired || copyUnsaved.disabled) return;
      clearCopyFeedback();
      const revision = copyRevision;
      const uncertainTexts = document.getElementById('uncertainTexts');
      const sections = [];
      if (input.value.trim()) sections.push('未发送草稿\n' + input.value);
      if (uncertainTexts.children.length) {
        const questions = Array.from(uncertainTexts.children, item => item.textContent);
        sections.push('发送结果待核对\n' + questions.join('\n\n'));
      }
      if (!sections.length) {
        copyStatus.textContent = '没有可复制的未保存内容。';
        return;
      }
      const text = sections.join('\n\n');
      copyUnsaved.disabled = true;
      try {
        await navigator.clipboard.writeText(text);
        if (revision === copyRevision) copyStatus.textContent = '已复制未保存内容。';
      } catch {
        if (revision !== copyRevision) return;
        copyStatus.textContent = '无法访问剪贴板，请手动复制下方选中的文本。';
        manualCopy.value = text;
        manualCopy.hidden = false;
        manualCopy.focus();
        manualCopy.select();
      } finally {
        copyUnsaved.disabled = false;
      }
    });

    const conversationList = document.getElementById('conversationList');
    const conversationSelect = document.getElementById('conversationSelect');
    const createConversationButton = document.getElementById('createConversation');
    const conversationDrafts = new Map();
    let conversations = [];
    let conversationID = '';
    let creatingConversation = false;
    let loadingConversations = true;
    let conversationListRequest = 0;

    function renderConversations() {
      conversationList.replaceChildren();
      conversationSelect.replaceChildren();
      for (const item of conversations) {
        const label = item.title || '新会话';
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'conv conversation-choice' + (item.id === conversationID ? ' active' : '');
        button.textContent = label;
        button.setAttribute('aria-current', item.id === conversationID ? 'true' : 'false');
        button.addEventListener('click', () => switchConversation(item.id));
        conversationList.appendChild(button);
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = label;
        conversationSelect.appendChild(option);
      }
      conversationSelect.value = conversationID;
    }

    async function fetchConversations() {
      const request = ++conversationListRequest;
      const res = await fetch('/api/conversations', {
        cache: 'no-store',
        headers: {Authorization: 'Bearer ' + token},
        signal: AbortSignal.timeout(10000),
      });
      if (res.status === 401) requireRelogin('登录已失效，请重新登录。');
      if (!res.ok) throw new Error('读取会话失败');
      const data = await res.json();
      if (request !== conversationListRequest || !canUseSession()) return;
      conversations = data.conversations;
      if (!conversationID && conversations.length) conversationID = conversations[0].id;
      renderConversations();
    }

    function switchConversation(id) {
      if (!canUseSession() || recovery.sending || creatingConversation || id === conversationID) {
        conversationSelect.value = conversationID;
        return;
      }
      recovery.cancelSync();
      const uncertainTexts = document.getElementById('uncertainTexts');
      conversationDrafts.set(conversationID, {input: input.value, uncertain: recovery.uncertain, retained: [...uncertainTexts.children]});
      conversationID = id;
      const draft = conversationDrafts.get(id);
      input.value = draft?.input || '';
      autoResize();
      recovery.uncertain = draft?.uncertain || false;
      uncertainTexts.replaceChildren(...(draft?.retained || []));
      document.getElementById('uncertainQuestions').hidden = !uncertainTexts.children.length;
      log.replaceChildren();
      conversationTickets.replaceChildren();
      conversationTickets.hidden = true;
      refreshConversationTickets();
      renderedHistory = null;
      addBubble(addAiContainer(false), '请输入问题，开始对话。');
      renderConversations();
      recovery.sync();
    }

    conversationSelect.addEventListener('change', () => switchConversation(conversationSelect.value));
    createConversationButton.addEventListener('click', async () => {
      if (!canUseSession() || recovery.sending || creatingConversation || loadingConversations) return;
      creatingConversation = true;
      updateControls(true);
      try {
        const item = await ticketRequestJSON('/api/conversations', {});
        if (!canUseSession()) return;
        conversationListRequest++;
        conversations = [item, ...conversations];
        creatingConversation = false;
        switchConversation(item.id);
      } catch {
        showStatus('新建会话失败，请重试。');
      } finally {
        creatingConversation = false;
        updateControls(recovery.sending || recovery.syncing);
      }
    });

    function chatPayload(text) {
      return JSON.stringify(conversationID ? {message: text, conversation_id: conversationID} : {message: text});
    }

    const recovery = new ChatRecovery({
      isActive: canUseSession,
      onAuthExpired: requireRelogin,
      fetchHistory: async (onProgress, signal) => {
        const selected = conversationID;
        const timeout = AbortSignal.timeout(10000);
        const options = {
          cache: 'no-store',
          headers: {'Authorization': 'Bearer ' + token},
          signal: signal ? AbortSignal.any([signal, timeout]) : timeout,
        };
        try {
          return await fetchPagedHistory(path => { options.signal.throwIfAborted(); const url = selected && path.startsWith('/api/conversation?')
            ? path + '&conversation_id=' + encodeURIComponent(selected) : path;
          return fetch(url, options); }, me.id, onProgress);
        } catch (error) {
          // 读取响应体时，浏览器可能只报告 AbortError。
          if (error.name === 'AbortError' && timeout.aborted) throw timeout.reason;
          throw error;
        }
      },
      onMessages: messages => {
        if (!messages.length) return; // 未落库时保留欢迎语或结果不确定的本地消息。
        const canReuse = renderedHistory && renderedHistory.length <= messages.length &&
          renderedHistory.every((previous, index) => {
            const message = messages[index];
            return message.role === previous.role && message.content === previous.content;
          });
        const firstNewMessage = canReuse ? renderedHistory.length : 0;
        if (firstNewMessage === messages.length) return;
        const previousTop = chatScroll.scrollTop;
        const atBottom = isAtBottom();
        if (!canReuse) {
          log.replaceChildren();
        }
        for (const message of messages.slice(firstNewMessage)) {
          if (message.role === 'user') addUserMsg(message.content, false);
          else if (message.role === 'assistant') addBubble(addAiContainer(false), message.content);
        }
        renderedHistory = messages;
        if (atBottom) scrollBottom();
        else {
          chatScroll.scrollTop = previousTop;
          updateJumpLatest();
        }
      },
      onStatus: showStatus,
      onBusy: updateControls,
    });
    syncBtn.addEventListener('click', () => { recovery.sync(); refreshConversationTickets(); });
    document.getElementById('cancelHistory').addEventListener('click', () => recovery.cancelSync());
    window.addEventListener('pagehide', () => {
      pageActive = false;
      recovery.cancelSync();
    });
    window.addEventListener('pageshow', event => {
      if (!event.persisted) return;
      if (localStorage.getItem('token') !== token) {
        window.location.reload();
        return;
      }
      pageActive = true;
      recovery.sync();
    });
    window.addEventListener('online', () => recovery.sync());
    window.addEventListener('offline', () => {
      const message = '网络已断开，联网后将同步历史；不会自动重发消息。';
      if (!recovery.cancelSync(message)) showStatus(message);
    });

    // 探测服务端是否支持流式对话：只探一次并缓存。
    // 探测失败（网络问题、旧版服务端）按不支持处理，走一次性接口 ——
    // 这样不会出现「先盲试流式、失败再重发」的双请求。
    let streamCapability = null;
    async function supportsStream() {
      if (streamCapability !== null) return streamCapability;
      try {
        const res = await fetch('/health', { cache: 'no-store' });
        const data = await res.json();
        streamCapability = Boolean(data.stream);
      } catch {
        streamCapability = false;
      }
      return streamCapability;
    }

    // 流式对话：逐字渲染回答，返回 { reply, sources, suggest }
    // 之所以手写 SSE 解析而不用 EventSource：本接口是 POST，EventSource 只支持 GET
    async function streamChat(text, typingEl) {
      const res = await fetch('/api/chat/stream', {
        method: 'POST',
        signal: AbortSignal.timeout(120000),
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: chatPayload(text),
      });
      if (!res.ok || !res.body) throw new Error('stream unavailable');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let reply = '';
      let sources = [];
      let suggest = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // SSE 以空行分隔帧；最后一段可能不完整，留在 buffer 里等下次拼接
        let sep;
        while ((sep = buffer.indexOf('\n\n')) >= 0) {
          const frame = buffer.slice(0, sep);
          buffer = buffer.slice(sep + 2);

          let event = 'message';
          const dataLines = [];
          for (const line of frame.split('\n')) {
            if (line.startsWith('event: ')) event = line.slice(7).trim();
            else if (line.startsWith('data: ')) dataLines.push(line.slice(6));
          }
          if (!dataLines.length) continue;

          let payload;
          try { payload = JSON.parse(dataLines.join('\n')); } catch { continue; }

          if (event === 'retrieval') {
            sources = payload.sources || [];
          } else if (event === 'delta') {
            reply += payload.text || '';
            typingEl.textContent = reply;
            typingEl.style.color = '';
            scrollBottom();
          } else if (event === 'done') {
            if (typeof payload.reply === 'string') reply = payload.reply;
            suggest = Boolean(payload.suggest_ticket);
          } else if (event === 'error') {
            throw new Error(payload.message || 'stream error');
          }
        }
      }

      if (!reply) throw new Error('stream empty');
      return { reply, sources, suggest };
    }

    async function handleSend() {
      const text = input.value.trim();
      if (!text || creatingConversation || loadingConversations || !recovery.beginSend()) return;
      renderedHistory = null;
      addUserMsg(text);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      const body = addAiContainer();
      const typing = addTyping(body);

      let reply = '';
      let suggest = false;
      let sources = [];
      let trace = [];
      let uncertain = false;
      try {
        // 优先走流式：能边生成边显示。服务端不支持时直接走一次性接口，
        // 不做「先试再回退」，避免每次发送多一个无用请求。
        let streamed = null;
        if (await supportsStream()) {
          try {
            streamed = await streamChat(text, typing);
          } catch (streamErr) {
            // 流式已经开始但中途失败：回退到一次性接口拿完整回答
            streamed = null;
          }
        }

        if (streamed) {
          reply = streamed.reply;
          suggest = streamed.suggest;
          sources = streamed.sources;
          // 流式接口不跑 Agent 循环，因此没有执行过程可展示
        } else {
          const res = await fetch('/api/chat', { method: 'POST', signal: AbortSignal.timeout(60000), headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: chatPayload(text) });
          if (res.status === 401) requireRelogin('登录已失效，请重新登录。');
          if (!res.ok) throw new Error('对话请求失败');
          const data = await res.json();
          if (typeof data.reply !== 'string') throw new Error('对话响应格式错误');
          reply = data.reply;
          suggest = data.suggest_ticket;
          sources = data.sources || [];
          trace = data.trace || [];
        }
      } catch (e) {
        uncertain = true;
        const retained = document.createElement('p');
        retained.textContent = text;
        document.getElementById('uncertainTexts').appendChild(retained);
        document.getElementById('uncertainQuestions').hidden = false;
        clearCopyFeedback();
        reply = '发送结果不确定，服务可能仍在处理。请点击「同步历史」查看已保存的回答，避免重复发送。';
      }

      // 用真实回复替换「正在思考」
      typing.textContent = reply;
      typing.style.color = '';

      // 先展示系统做过什么，再展示引用了什么
      addTrace(body, trace);
      addSources(body, sources);

      if (suggest) {
        if (!conversationID && !uncertain) {
          await fetchConversations().catch(() => {});
        }
        addConfirmTicket(body, text, sources, conversationID);
      }

      await recovery.finishSend(uncertain);
      if (!uncertain && canUseSession()) fetchConversations().catch(() => {});
      scrollBottom();
    }

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }
    input.addEventListener('input', autoResize);
    input.addEventListener('input', clearCopyFeedback);
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
    sendBtn.addEventListener('click', handleSend);

    function fillAndSend(t) {
      if (!canUseSession()) return;
      input.value = t;
      handleSend();
    }
    // ---- 加载历史对话，让用户「记得」之前聊过什么 ----
    if (token && me && me.role !== 'admin') {
      updateControls(false);
      fetchConversations().catch(() => {}).finally(() => {
        loadingConversations = false;
        updateControls(false);
        recovery.sync();
        refreshConversationTickets();
      });
      loadTickets();
    }

    // ---- 加载真实订单信息到右侧面板 ----
    async function loadOrder() {
      try {
        const res = await fetch('/api/order', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        const o = data.order;
        if (!o || !o.has_order) return;
        document.getElementById('custProduct').textContent = o.product_name;
        document.getElementById('custStatus').textContent = o.in_service ? '服务期内' : '服务期外';
        document.getElementById('custStatus').className = 'pill ' + (o.in_service ? 'ok' : 'warn');
        document.getElementById('custExpire').textContent = new Date(o.expires_at * 1000).toISOString().slice(0, 10);
      } catch (e) { /* 拉取失败保持默认 */ }
    }
    loadOrder();
  </script>
</body>
</html>
