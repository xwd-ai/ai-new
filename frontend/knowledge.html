<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识资料 · AI 客服与工单助手</title>
  <style>
    :root { --bg:#f3f5f9; --surface:#fff; --text:#1a1d27; --muted:#657086; --primary:#4f6ef7; --border:#dce2ed; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif; }
    header { padding:18px 24px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    nav { display:flex; gap:20px; } a { color:var(--primary); text-underline-offset:4px; }
    main { max-width:1240px; margin:auto; padding:28px 24px 48px; }
    h1 { font-size:28px; margin:0 0 8px; } h2 { font-size:20px; margin:0; overflow-wrap:anywhere; }
    p { margin:8px 0 16px; } .muted { color:var(--muted); }
    fieldset { border:0; padding:0; margin:24px 0 16px; display:flex; align-items:end; gap:16px; flex-wrap:wrap; }
    label { display:grid; gap:6px; font-weight:600; } .title-field { flex:1; min-width:180px; }
    input,select,textarea,button { font:inherit; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:white; color:var(--text); }
    textarea { width:100%; resize:vertical; } details { margin:20px 0; } summary { cursor:pointer; font-weight:600; }
    #ingestFields { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    #ingestFields input { min-width:0; width:100%; }
    .full { grid-column:1/-1; } #ingestStatus { overflow-wrap:anywhere; }
    button { cursor:pointer; } button.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
    button:disabled,fieldset:disabled { opacity:.55; cursor:not-allowed; }
    :focus-visible { outline:3px solid #a7b5ff; outline-offset:3px; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:24px; align-items:start; }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; min-width:0; }
    .table-wrap { overflow-x:auto; } table { border-collapse:collapse; width:100%; text-align:left; }
    .pending-table table { min-width:520px; }
    .pending-table td:nth-child(4) { white-space:nowrap; }
    th,td { border-bottom:1px solid var(--border); padding:12px 8px; vertical-align:top; overflow-wrap:anywhere; }
    th { color:var(--muted); font-size:13px; font-weight:500; } td:nth-child(3) { font:12px/1.6 Consolas,monospace; max-width:130px; }
    th:nth-child(2),td:nth-child(2),td:last-child { white-space:nowrap; } .paging,.detail-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:16px; }
    .detail-head { margin-top:0; } pre { white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; border-top:1px solid var(--border); padding-top:20px; }
    [hidden] { display:none !important; }
    @media(max-width:800px) { .workspace { grid-template-columns:1fr; } main { padding:24px 16px; } }
    @media(max-width:500px) { #ingestFields { grid-template-columns:minmax(0,1fr); } }
  </style>
</head>
<body>
  <header><strong>AI 客服与工单助手</strong><nav aria-label="管理导航"><a href="/admin">工单管理</a><a href="/settings">检索设置</a></nav></header>
  <main>
    <h1>知识资料</h1>
    <p class="muted">按标题与类型查找资料，查看回答所依据的原文。</p>
    <p id="access" role="status">正在核对管理员身份…</p>
    <p id="loginLink" hidden><a href="/login">前往登录</a></p>
    <details class="panel">
      <summary>添加文本资料</summary>
      <p class="muted">粘贴手册、常见问题或规则正文。相同标题与正文重复提交会返回已有资料。</p>
      <form id="ingestForm"><fieldset id="ingestFields" disabled>
        <label>资料标题<input id="ingestTitle" maxlength="200" required /></label>
        <label>入库类型<select id="ingestKind"><option value="manual">手册</option><option value="faq">FAQ</option><option value="rule">规则</option></select></label>
        <label class="full">资料正文<textarea id="ingestContent" rows="7" maxlength="100000" required></textarea></label>
        <label class="full">关键词（可选）<textarea id="ingestKeywords" rows="2" placeholder="逗号或换行分隔，最多 20 个；留空自动提取"></textarea></label>
        <div class="full"><button class="primary">提交入库</button></div>
      </fieldset></form>
      <p id="ingestStatus" role="status" aria-live="polite">提交后保留输入，方便核对或修改；不会自动重复提交。</p>
      <button id="viewSaved" type="button" hidden>查看入库原文</button>
    </details>
    <details class="panel">
      <summary>恢复未完成入库</summary>
      <p class="muted">待恢复记录可能仍在执行。若提示处理中，请稍后刷新核对。刷新从首页读取。</p>
      <button id="refreshPending" type="button" disabled>刷新待恢复列表</button>
      <p id="pendingStatus" role="status" aria-live="polite">点击刷新读取待恢复记录。</p>
      <div class="table-wrap pending-table" role="region" aria-label="待恢复记录" tabindex="0"><table><thead><tr><th scope="col">预留资料编号</th><th scope="col">处理阶段</th><th scope="col">分块数</th><th scope="col">更新时间</th><th scope="col">操作</th></tr></thead><tbody id="pendingRows"></tbody></table></div>
      <div class="paging" role="group" aria-label="待恢复记录分页">
        <button id="pendingPrevious" type="button" disabled>上一页</button>
        <span class="muted">每页 20 条</span>
        <button id="pendingNext" type="button" disabled>下一页</button>
      </div>
      <p id="recoveryStatus" role="status" aria-live="polite"></p>
    </details>
    <form id="searchForm"><fieldset id="filters" disabled>
      <label class="title-field">标题包含<input id="title" maxlength="200" placeholder="例如：导出 FAQ" /></label>
      <label>资料类型<select id="kind"><option value="">全部类型</option value="manual">手册</option><option value="faq">FAQ</option><option value="rule">规则</option></select></label>
      <button class="primary">筛选 / 刷新</button>
    </fieldset></form>
    <div class="workspace">
      <section class="panel" aria-label="资料列表">
        <p id="status" class="muted" role="status" aria-live="polite">登录管理员账号后加载资料。</p>
        <div class="table-wrap"><table><thead><tr><th scope="col">标题</th><th scope="col">类型</th><th scope="col">编号</th><th scope="col">原文</th></tr></thead><tbody id="rows"></tbody></table></div>
        <div class="paging"><button id="previous" disabled>上一页</button><span class="muted">每页 20 条</span><button id="next" disabled>下一页</button></div>
        <p class="muted">新增资料可能改变后续页面的位置，可点击筛选 / 刷新回到首页。</p>
      </section>
      <section id="detail" class="panel" aria-label="资料原文" hidden>
        <div class="detail-head"><h2 id="detailTitle"></h2><button id="closeDetail">关闭</button></div>
        <p id="keywords" class="muted"></p><pre id="content"></pre>
      </section>
    </div>
  </main>
  <script src="/assets/knowledge-ingest.js" defer></script>
  <script src="/assets/knowledge-recovery.js" defer></script>
  <script src="/assets/knowledge-browser.js" defer></script>
</body>
</html>
