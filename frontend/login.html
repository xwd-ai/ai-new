<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · AI 客服与工单助手</title>
  <style>
    :root {
      --primary: #4f6ef7;
      --primary-grad: linear-gradient(135deg, #4f6ef7 0%, #7a5cf0 100%);
      --text: #1a1d27;
      --muted: #8a919f;
      --border: #e9edf3;
      --danger: #f0525c;
      --ok: #2ec27e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 600px at 20% 0%, #eef2ff 0%, transparent 50%),
                  radial-gradient(1000px 600px at 100% 100%, #f3efff 0%, transparent 50%),
                  #f5f7fb;
      color: var(--text); padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 400px; background: #fff;
      border-radius: 20px; box-shadow: 0 4px 16px rgba(20,30,60,.06), 0 24px 60px rgba(20,30,60,.10);
      padding: 40px 36px;
    }
    .logo {
      width: 52px; height: 52px; border-radius: 14px; background: var(--primary-grad);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: 700;
      margin: 0 auto 18px; box-shadow: 0 8px 20px rgba(79,110,247,.35);
    }
    h1 { font-size: 20px; text-align: center; font-weight: 700; }
    .sub { text-align: center; color: var(--muted); font-size: 13px; margin-top: 6px; margin-bottom: 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: #3c4351; }
    .field input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.12); }
    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 11px; background: var(--primary-grad);
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
      box-shadow: 0 6px 16px rgba(79,110,247,.30); transition: transform .12s, box-shadow .12s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79,110,247,.40); }
    .btn:active { transform: none; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error { color: var(--danger); font-size: 13px; text-align: center; min-height: 18px; margin-top: 12px; }
    .tips {
      margin-top: 22px; padding: 14px; border-radius: 10px; background: #f7f9fc;
      border: 1px dashed var(--border); font-size: 12.5px; color: var(--muted); line-height: 1.8;
    }
    .tips b { color: #3c4351; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">AI</div>
    <h1>AI 客服与工单助手</h1>
    <p class="sub">登录后开始使用</p>

    <form id="loginForm">
      <div class="field">
        <label>账号</label>
        <input id="username" type="text" autocomplete="username" placeholder="请输入账号" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
      </div>
      <button class="btn" id="loginBtn" type="submit">登 录</button>
    </form>
    <div class="error" id="error"></div>

    <div class="tips">
      <b>演示账号</b><br>
      管理员：<b>admin</b> / <b>admin123</b><br>
      普通用户：<b>customer</b> / <b>customer123</b>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      errorEl.textContent = '';

      if (!username || !password) { errorEl.textContent = '请输入账号和密码'; return; }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '登录中…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          errorEl.textContent = '账号或密码错误';
        }
      } catch (err) {
        errorEl.textContent = '网络错误，请稍后重试';
      } finally {
        btn.disabled = false; btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
